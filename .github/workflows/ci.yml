name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
          POSTGRES_DB: documind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAKE_MODELS: "true"
      TEST_DATABASE_URL: postgresql+psycopg://documind:documind@localhost:5432/documind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Retrieval eval (stand-in models, pipeline check only)
        env:
          DATABASE_URL: postgresql+psycopg://documind:documind@localhost:5432/documind_test
        run: python -m eval.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
